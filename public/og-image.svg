<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Soft, warm minimalist background representing the 'paper' color theme (#FFF8FB) -->
  <rect width="1200" height="630" fill="#FFF8FB" />

  <!-- Elegant subtle background pattern matching the 'rule' color (#EADCF0) -->
  <g stroke="#EADCF0" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Left Side: Modern, elevated layout representing layers and the branding symbol -->
  <!-- Layer 3: shadow/glow underlay -->
  <rect x="120" y="145" width="340" height="340" rx="40" fill="#FDE8EF" opacity="0.6" transform="rotate(-3 290 315)" />
  <!-- Layer 2: decorative soft accent layer -->
  <rect x="110" y="135" width="340" height="340" rx="40" fill="#DFF5EA" opacity="0.8" transform="rotate(3 280 305)" />
  <!-- Layer 1: the main brand badge -->
  <rect x="100" y="125" width="340" height="340" rx="40" fill="#B3402A" />

  <!-- Iconic Chinese character "拼" (pīn) inside the badge -->
  <text x="270" y="355" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="190" font-weight="bold" fill="#FFF8FB" text-anchor="middle">拼</text>

  <!-- Right Side: Clean, structured typography introducing PinyinLayer -->
  <!-- Tagline / Badge -->
  <rect x="520" y="150" width="220" height="36" rx="18" fill="#DFF5EA" />
  <text x="630" y="173" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#7EC8A8" letter-spacing="1.5" text-anchor="middle">CHINESE READER</text>

  <!-- Title -->
  <text x="520" y="255" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#4A4458" letter-spacing="-1.5">PinyinLayer</text>

  <!-- Tagline / Subtitle -->
  <text x="520" y="315" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#756D88">Reading assistance, layered.</text>

  <!-- Features list with beautiful custom green bullet layers -->
  <g transform="translate(520, 365)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="16" height="16" rx="5" fill="#7EC8A8" />
    <text x="32" y="14" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#4A4458">Interactive Chinese reading assistance with toggleable pinyin</text>

    <!-- Feature 2 -->
    <rect x="0" y="32" width="16" height="16" rx="5" fill="#C4B0E8" />
    <text x="32" y="46" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#4A4458">HSK annotations filtering to master vocabulary step-by-step</text>

    <!-- Feature 3 -->
    <rect x="0" y="64" width="16" height="16" rx="5" fill="#F098AE" />
    <text x="32" y="78" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#4A4458">Instant offline tap-to-define and local vocabulary collection</text>
  </g>

  <!-- Clean footer branding -->
  <text x="520" y="525" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#B0A8BE" letter-spacing="1">PINYINLAYER.NETLIFY.APP</text>
</svg>
